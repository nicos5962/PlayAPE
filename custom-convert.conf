# PlayAPE: APE transcoding rules that can start and stop inside a file, as
# needed to play the virtual tracks of an APE file with an embedded cuesheet.
#
# %s = start offset in seconds, %w = duration (end - start) in seconds.
# The pcm rule outputs 16 bit little endian raw audio.
#
# The ffmpeg binary must be known to the server.

# Output formats from least to most favorite: flac is preferred over pcm.
proxy ape pcm,flc

ape pcm * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ $END$ -f s16le -acodec pcm_s16le -

ape flc * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ $END$ -f flac -compression_level 0 -

ape mp3 * *
	# FT:{START=-ss %s}U:{END=-t %w}B:{BITRATE=--abr %B}D:{RESAMPLE=--resample %D}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ $END$ -f wav -acodec pcm_s16le - | [lame] --silent -q $QUALITY$ $RESAMPLE$ $BITRATE$ - -
